spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
app.jwt.secret=test-secret-key-must-be-at-least-32-characters-long
app.jwt.expiration=3600000

# E-mail (desabilitado nos testes)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=test@test.com
app.base-url=http://localhost:5173

# Admin
app.admin.nome=Administrador GPM
app.admin.email=admin@gpm.com
app.admin.cpf=00000000000
app.admin.senha=admin123

# RabbitMQ (mock nos testes)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest