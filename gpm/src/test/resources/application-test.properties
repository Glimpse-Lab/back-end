spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
app.jwt.secret=glimpse-lab-gpm-chave-secreta-super-segura-change-in-production
app.jwt.expiration=3600000

# --- Configurações de E-mail (Brevo) ---
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Credenciais do Administrador Padrão ---
app.admin.nome=Administrador GPM
app.admin.email=admin@gpm.com
app.admin.cpf=00000000000
app.admin.senha=admin123

