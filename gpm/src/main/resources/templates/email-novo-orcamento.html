<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo orçamento recebido</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background: #f2f4f7; margin:0; padding:20px; color:#344154;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 6px rgba(20,30,50,0.08);">
                <tr style="background:linear-gradient(90deg,#0ea5a4,#3b82f6); color:#fff;">
                    <td style="padding:20px 24px;">
                        <h1 style="margin:0; font-size:20px; font-weight:600;">Novo orçamento recebido</h1>
                        <p style="margin:6px 0 0; font-size:13px; opacity:0.95;">Um novo orçamento foi enviado no sistema GPM.</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 24px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="padding-bottom:12px; vertical-align:top;">
                                    <p style="margin:0; color:#6b7280; font-size:13px;"><strong style="color:#111827;">ID:</strong> <span th:text="${orcamentoId}"></span></p>
                                </td>
                                <td style="padding-bottom:12px; vertical-align:top; text-align:right;">
                                    <p style="margin:0; color:#6b7280; font-size:13px;"><strong style="color:#111827;">Status:</strong> <span th:text="${status}"></span></p>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2" style="padding-bottom:8px;">
                                    <p style="margin:0; color:#6b7280; font-size:13px;"><strong style="color:#111827;">Cliente:</strong> <span th:text="${clienteNome}"></span></p>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2" style="padding-bottom:8px;">
                                    <p style="margin:0; color:#6b7280; font-size:13px;"><strong style="color:#111827;">E-mail do cliente:</strong> <span th:text="${clienteEmail}"></span></p>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2" style="padding-bottom:8px;">
                                    <p style="margin:0; color:#6b7280; font-size:13px;"><strong style="color:#111827;">Data:</strong> <span th:text="${dataSolicitacao}"></span></p>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2" style="padding-bottom:12px;">
                                    <p style="margin:0; color:#6b7280; font-size:13px;"><strong style="color:#111827;">Endereço:</strong> <span th:text="${endereco}"></span></p>
                                </td>
                            </tr>
                        </table>

                        <div style="margin-top:14px; padding:14px; background:#f9fafb; border:1px solid #eef2f7; border-radius:6px;">
                            <p style="margin:0 0 8px 0; color:#6b7280; font-size:13px;"><strong style="color:#111827;">Descrição do projeto</strong></p>
                            <div style="color:#111827; background:#fff; padding:12px; border-radius:4px; border:1px solid #eef2f7;" th:text="${descricaoProjeto}"></div>
                        </div>

                        <div style="margin-top:20px; text-align:left;">
                            <a th:href="${baseUrl + '/admin/orcamentos'}" style="display:inline-block; padding:10px 14px; background:#0ea5a4; color:#ffffff; text-decoration:none; border-radius:6px; font-weight:600; font-size:14px;">Abrir orçamento</a>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="background:#fbfdff; padding:12px 24px; font-size:12px; color:#6b7280;">
                        <p style="margin:0;">Este é um e-mail automático do sistema GPM. Não responda diretamente a esta mensagem.</p>
                    </td>
                </tr>
            </table>
            <p style="font-size:12px; color:#9ca3af; margin-top:14px;">GPM — Gestão de Projetos e Materiais</p>
        </td>
    </tr>
</table>
</body>
</html>
